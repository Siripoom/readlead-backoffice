<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ล้างข้อมูล · ReadLead</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Thai',sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f8;padding:24px;}
  .card{background:#fff;border:1px solid #e7e8ee;border-radius:18px;max-width:440px;width:100%;padding:40px 34px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.035),0 18px 40px -18px rgba(20,20,40,.18);}
  .ic{width:64px;height:64px;border-radius:50%;background:#fdf3f4;display:grid;place-items:center;margin:0 auto 20px;font-size:30px;}
  h1{font-size:20px;font-weight:800;color:#2b2d3a;margin-bottom:8px;}
  p{font-size:14px;color:#8a8fa0;line-height:1.7;margin-bottom:6px;}
  .count{font-size:13px;color:#5b5f6e;margin:18px 0 24px;}
  .count b{color:#cc4452;font-weight:800;}
  .keys{font-size:11.5px;color:#a0a5b4;line-height:1.9;margin:0 0 24px;word-break:break-all;}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  a.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;transition:.15s;cursor:pointer;border:none;}
  a.primary{background:#cc4452;color:#fff;}
  a.primary:hover{background:#b8323f;}
  a.ghost{background:#f6f7fa;color:#5b5f6e;}
  a.ghost:hover{background:#eceef3;}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">🧹</div>
    <h1>ล้างข้อมูล ReadLead แล้ว</h1>
    <p>ข้อมูลทดสอบทั้งหมดในเบราว์เซอร์นี้ถูกล้างเรียบร้อย</p>
    <p>นิยาย · ตอน · คอมเมนต์ · โหวต · วิว · บัญชี · เหรียญ · EXP · ตั๋ว · CMS</p>
    <div class="count">ลบไป <b id="n">0</b> รายการ ตู้ข้อมูลว่างเปล่าเหมือนติดตั้งใหม่</div>
    <div class="keys" id="keys"></div>
    <div class="row">
      <a class="btn primary" href="home_auth_1.html">ไปหน้าหลัก</a>
      <a class="btn ghost" href="reader_auth_1.html">เปิดหน้าอ่าน</a>
    </div>
  </div>
<script>
(function(){
  var removed=[];
  try{
    Object.keys(localStorage).forEach(function(k){
      if(k.indexOf('rl_')===0){ removed.push(k); localStorage.removeItem(k); }
    });
  }catch(e){}
  document.getElementById('n').textContent=removed.length;
  document.getElementById('keys').textContent = removed.length ? ('ที่ลบ: '+removed.join(' · ')) : 'ไม่มีข้อมูล ReadLead ค้างอยู่แล้ว';
})();
</script>
</body>
</html>
